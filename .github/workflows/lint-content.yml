name: Content rules

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-rules:
    name: Brand voice and punctuation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the diff-base comparison needs the base branch head,
          # which a shallow clone lacks once a PR carries more than one commit
          # (git diff fails with "bad object", exit 2, red check with zero
          # actual violations). Incident logged 2026-08-11.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run check-rules.py against changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No diff base available; scanning full default scope."
            python3 workflow/check-rules.py
          else
            echo "Comparing against $BASE_SHA"
            python3 workflow/check-rules.py --diff-base "$BASE_SHA"
          fi

  qa-battery:
    # Full-scope content battery: every canonical draft, every standing rule,
    # on every push. Diff-mode check-rules only sees touched files, which is
    # how legacy violations sat dormant until the 2026-08-11 go-live QA.
    # This job closes that gap. Known legacy debt lives in
    # workflow/qa-baseline.txt (remove-only ratchet); new content must pass
    # outright.
    name: Content QA battery (all articles)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run qa_battery.py across all articles
        run: python3 workflow/qa_battery.py

  tests:
    name: Pytest suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v
