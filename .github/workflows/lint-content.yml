name: Content rules

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-rules:
    name: Brand voice and punctuation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run check-rules.py against changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No diff base available; scanning full default scope."
            python3 workflow/check-rules.py
          else
            echo "Comparing against $BASE_SHA"
            python3 workflow/check-rules.py --diff-base "$BASE_SHA"
          fi

  qa-battery:
    # Full-scope content battery: every canonical draft, every standing rule,
    # on every push. Diff-mode check-rules only sees touched files, which is
    # how legacy violations sat dormant until the 2026-08-11 go-live QA.
    # This job closes that gap. Known legacy debt lives in
    # workflow/qa-baseline.txt (remove-only ratchet); new content must pass
    # outright.
    name: Content QA battery (all articles)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run qa_battery.py across all articles
        run: python3 workflow/qa_battery.py

  brain:
    # The operation's index over its own knowledge. Registries under brain/ are
    # generated from the incident log, the roadmap, and the article folders, so
    # a source change without a rebuild leaves the brain describing a repo that
    # no longer exists. This job fails on that drift, and on a rule or decision
    # id cited anywhere in brain/ or CLAUDE.md that does not resolve.
    # brain-rule: R-process-brain-rebuild
    name: Brain index is current
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run brain.py check
        run: python3 workflow/brain.py check

  tests:
    name: Pytest suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v
